name: "Unity C# Game"
language: "C#"
description: "Spieleentwicklung mit Unity Engine und C#: Saubere Projektstruktur, Assembly Definitions (asmdef), GameManager, F11 Vollbild/Fenstermodus, Input System, EditMode/PlayMode Tests und Git-LFS Vorbereitung."
options:
  - id: "unity_version"
    type: "select"
    label: "Unity Version"
    description: "Wähle die Unity Editor-Version"
    default: "6000.0"
    choices:
      - value: "6000.0"
        label: "Unity 6 (LTS / 6000.0)"
        description: "Modernste Long-Term-Support-Version mit optimierter Performance, neuem Render-Graph und WebGPU-Support."
      - value: "2022.3"
        label: "Unity 2022.3 LTS"
        description: "Bewährte Long-Term-Support-Version mit maximaler Stabilität und Kompatibilität zu bestehenden Asset-Store-Paketen."
  - id: "render_pipeline"
    type: "select"
    label: "Render Pipeline"
    description: "Wähle die Rendering-Architektur"
    default: "urp"
    choices:
      - value: "urp"
        label: "Universal Render Pipeline (URP)"
        description: "Optimierte, plattformübergreifende Pipeline für 2D & 3D mit Post-Processing, Custom Renderer Features und hoher Performance."
      - value: "builtin"
        label: "Built-in Render Pipeline (Standard)"
        description: "Klassische Unity-Standard-Pipeline für traditionelle Shader und maximale Abwärtskompatibilität."
  - id: "dimension"
    type: "select"
    label: "Projekt-Dimension"
    description: "Wähle die primäre Spiel-Dimension"
    default: "3d"
    choices:
      - value: "3d"
        label: "3D (Perspektivisch)"
        description: "3D-Szene mit Perspektiv-Kamera, gerichteter Beleuchtung und 3D-Physik."
      - value: "2d"
        label: "2D (Orthografisch)"
        description: "2D-Setup mit Orthografischer Kamera, 2D-Physikmodulen und Sprite-Unterstützung."
  - id: "new_input_system"
    type: "bool"
    label: "Modernes Unity Input System (com.unity.inputsystem)"
    description: "Aktiviert das ereignisbasierte neue Unity Input System mit Multi-Device- und Gamepad-Unterstützung"
    default: true
  - id: "test_framework"
    type: "bool"
    label: "Unity Test Framework (EditMode & PlayMode)"
    description: "Richtet automatisierte NUnit-Tests im Unity Test Runner mit dedizierten Assembly Definitions ein"
    default: true
  - id: "github_actions"
    type: "bool"
    label: "GitHub Actions CI (GameCI Unity Test Runner)"
    description: "Automatisierter CI/CD-Workflow für Unit- und Integrationstests auf GitHub Actions"
    default: true
  - id: "vscode"
    type: "bool"
    label: "VS Code Konfiguration (.vscode/)"
    description: "Optimierte IDE-Einstellungen und empfohlene Extensions für C# Dev Kit und Unity"
    default: true
file_conditions:
  - pattern: ".github/"
    when: "github_actions"
  - pattern: ".vscode/"
    when: "vscode"
  - pattern: "Assets/Tests/"
    when: "test_framework"
