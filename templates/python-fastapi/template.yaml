name: "Python FastAPI"
language: "Python"
description: "Asynchrone Web-API mit FastAPI, uv, Ruff und Docker"
options:
  - id: "docker"
    label: "Dockerfile & Docker Compose"
    default: true
  - id: "github_actions"
    label: "GitHub Actions CI (Ruff, Pytest)"
    default: true
file_conditions:
  - pattern: ".github/"
    when: "github_actions"
  - pattern: "Dockerfile"
    when: "docker"
  - pattern: "docker-compose"
    when: "docker"
hooks:
  pre_init:
    - ["uv", "init"]
    - ["uv", "venv"]
  post_create:
    - ["uv", "sync"]