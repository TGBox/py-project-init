name: "Python CLI"
language: "Python"
description: "Standard CLI-Setup mit uv, pytest und ruff"
options:
  - id: "docker"
    label: "Dockerfile & Compose einbinden"
    default: false
  - id: "github_actions"
    label: "CI-Workflow (.github/workflows/ci.yml)"
    default: true
  - id: "vscode"
    label: "VS Code Configs (.vscode/settings.json)"
    default: true
file_conditions:
  - pattern: ".github/"
    when: "github_actions"
  - pattern: "Dockerfile"
    when: "docker"
  - pattern: "docker-compose"
    when: "docker"
  - pattern: ".vscode/"
    when: "vscode"
hooks:
  post_create:
    - ["uv", "sync"]