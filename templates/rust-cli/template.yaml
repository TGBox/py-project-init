name: "Rust CLI"
language: "Rust"
description: "Performantes Rust CLI-Projekt mit Cargo, Clippy und GitHub Actions"
options:
  - id: "github_actions"
    label: "GitHub Actions CI (Fmt, Clippy, Test)"
    default: true
  - id: "docker"
    label: "Multi-Stage Dockerfile"
    default: false
file_conditions:
  - pattern: ".github/"
    when: "github_actions"
  - pattern: "Dockerfile"
    when: "docker"
  - pattern: "docker-compose"
    when: "docker"
hooks:
  post_create:
    - ["cargo", "check"]