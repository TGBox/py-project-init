pre-commit:
  name: "Pre-Commit: Secret- & Size-Scanner"
  description: "Blockiert gestagte Secrets (.env/Keys) und Dateien >10MB vor dem Commit."
  default: true

commit-msg:
  name: "Commit-Msg: Conventional Commits Linter"
  description: "Erzwingt standardisierte Commit-Nachrichten (feat:, fix:, chore:, docs:, etc.)."
  default: true

prepare-commit-msg:
  name: "Prepare-Commit-Msg: Ticket-ID aus Branch"
  description: "Liest Ticket-IDs aus dem Branch-Namen (z.B. feature/PROJ-123 -> [PROJ-123]) und stellt sie voran."
  default: false

post-commit:
  name: "Post-Commit: SemVer-Bump & Changelog-Generator"
  description: "Fragt nach SemVer-Bumps, aktualisiert Lockfiles, pflegt CHANGELOG.md per Amend und setzt optional Git-Tags."
  default: true

post-checkout:
  name: "Post-Checkout: Dependency-Sync & Branch-Warnung"
  description: "Führt uv sync oder npm install aus, wenn Lockfiles geändert wurden, und warnt vor Arbeit auf main."
  default: true

post-merge:
  name: "Post-Merge: Lockfile-Sync & .env-Vergleich"
  description: "Synchronisiert Abhängigkeiten nach Merges/Pulls und warnt vor fehlenden Schlüsseln aus .env.example."
  default: true

pre-rebase:
  name: "Pre-Rebase: Historien-Schutz für main/master"
  description: "Blockiert versehentliches Rebasen der Haupt-Branches (main/master)."
  default: true

pre-push:
  name: "Pre-Push: Branch-Schutz & Test-Gate"
  description: "Blockiert direkte Pushes auf main/master und führt vor dem Push die Test-Suite aus."
  default: true
